name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.8.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify package.json versions match tag
        run: |
          ROOT=$(node -p "require('./package.json').version")
          INST=$(node -p "require('./installer/package.json').version")
          MANIFEST=$(node -p "require('./openclaw.plugin.json').version")
          EXPECTED="${{ steps.ver.outputs.version }}"
          for name in ROOT INST MANIFEST; do
            actual="${!name}"
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error::$name version $actual does not match tag $EXPECTED"
              exit 1
            fi
          done

      # Installer must be published first because the plugin depends on it.
      - name: Install installer deps
        working-directory: installer
        run: npm install

      - name: Publish @folotoy/folotoy-openclaw-installer
        working-directory: installer
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if curl -fsS "https://registry.npmjs.org/@folotoy/folotoy-openclaw-installer/$VERSION" >/dev/null 2>&1; then
            echo "installer $VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for installer to be available on npm
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          URL="https://registry.npmjs.org/@folotoy/folotoy-openclaw-installer/$VERSION"
          for i in {1..60}; do
            if curl -fsS "$URL" >/dev/null 2>&1; then
              echo "installer $VERSION is available on registry"
              exit 0
            fi
            echo "waiting for installer to propagate ($i/60)..."
            sleep 5
          done
          echo "::error::installer $VERSION did not appear on npm registry after 300s"
          exit 1

      - name: Install root deps
        run: npm install

      - run: npm test

      - name: Publish @folotoy/folotoy-openclaw-plugin
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if curl -fsS "https://registry.npmjs.org/@folotoy/folotoy-openclaw-plugin/$VERSION" >/dev/null 2>&1; then
            echo "plugin $VERSION already published, skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
